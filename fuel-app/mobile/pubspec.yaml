name: fuel_app
description: App colaborativo de preços de combustível
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.3.0
  google_maps_flutter: ^2.6.0
  geolocator: ^11.0.0
  flutter_polyline_points: ^2.0.0
  fl_chart: ^0.68.0
  url_launcher: ^6.2.0
  provider: ^6.1.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/